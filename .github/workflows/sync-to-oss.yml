name: Sync Release to OSS

# Release 发布后自动触发，或手动触发
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (如 v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  sync-to-oss:
    runs-on: ubuntu-latest
    steps:
      - name: 准备版本变量
        id: vars
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          VERSION="${RAW_TAG#v}"
          echo "tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 下载 Release 附件
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ steps.vars.outputs.tag }}
          fileName: "*.zip"

      - name: 安装 ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: ${{ secrets.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: 上传到 OSS（版本目录）
        run: ossutil cp *.zip oss://${{ secrets.OSS_BUCKET }}/adb-bot/${{ steps.vars.outputs.tag }}/ -r -f

      - name: 同步到 latest（覆盖，供官网直接下载）
        run: ossutil cp oss://${{ secrets.OSS_BUCKET }}/adb-bot/${{ steps.vars.outputs.tag }}/adb-bot-v${{ steps.vars.outputs.version }}-win-x64.zip oss://${{ secrets.OSS_BUCKET }}/adb-bot/latest/adb-bot-win-x64.zip -f
